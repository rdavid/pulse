# SPDX-License-Identifier: 0BSD
#
# Each Trivy scan runs against its pushed digest rather than a local
# image: buildx keeps a multi-platform build out of the local Docker
# store, so there is nothing to load and scan before the push. The
# ignore-unfixed flag skips base-image CVEs with no available patch,
# which would otherwise fail every run for issues nobody can act on.
# The release step runs last so a failed scan blocks it, and it
# publishes against the tag that triggered the workflow with an
# auto-generated changelog body.
---
name: publish
'on':
  push:
    tags:
      - v*
permissions:
  contents: write
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: sh
env:
  CLIENT: ${{ github.repository }}-client
  REGISTRY: ghcr.io
  SERVER: ${{ github.repository }}-server
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
      - uses: docker/metadata-action@v6.2.0
        id: meta-client
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT }}
          labels: |
            maintainer=David Rabkin
            org.opencontainers.image.description=Client -> Server
            org.opencontainers.image.licenses=0BSD
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.title=Pulse Client
            org.opencontainers.image.vendor=David Rabkin
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},priority=901
      - uses: docker/build-push-action@v7.3.0
        id: build-client
        with:
          context: .
          file: client/Containerfile
          labels: ${{ steps.meta-client.outputs.labels }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: '1'
          ignore-unfixed: true
          image-ref: "\
            ${{ env.REGISTRY }}/${{ env.CLIENT }}\
            @${{ steps.build-client.outputs.digest }}"
          severity: CRITICAL,HIGH
      - uses: docker/metadata-action@v6.2.0
        id: meta-server
        with:
          images: ${{ env.REGISTRY }}/${{ env.SERVER }}
          labels: |
            maintainer=David Rabkin
            org.opencontainers.image.description=Server -> Client
            org.opencontainers.image.licenses=0BSD
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.title=Pulse Server
            org.opencontainers.image.vendor=David Rabkin
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},priority=901
      - uses: docker/build-push-action@v7.3.0
        id: build-server
        with:
          context: .
          file: server/Containerfile
          labels: ${{ steps.meta-server.outputs.labels }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: '1'
          ignore-unfixed: true
          image-ref: "\
            ${{ env.REGISTRY }}/${{ env.SERVER }}\
            @${{ steps.build-server.outputs.digest }}"
          severity: CRITICAL,HIGH
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
