---
services:
  client:
    build:
      context: .
      dockerfile: client/Containerfile
    cap_drop:
      - ALL
    depends_on:
      - server
    environment:
      - LISTEN_PORT=9090
      - SERVER_HOST=server
      - SERVER_PORT=8080
      - TEST_MODE=true
    image: pulse-client:latest
    ports:
      - 9090:9090
    restart: 'no'
    security_opt:
      - no-new-privileges:true
  server:
    build:
      context: .
      dockerfile: server/Containerfile
    cap_drop:
      - ALL
    environment:
      - DBFILE=dat/db
      - CLIENT_HOST=client
      - CLIENT_PORT=9090
      - LISTEN_PORT=8080
      - TEST_MODE=true
    image: pulse-server:latest
    ports:
      - 8080:8080
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    user: 1001:1001
    volumes:
      - ./dat:/home/server/dat
